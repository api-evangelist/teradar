aid: teradar
name: Teradar
description: 'Teradar is a Boston, Massachusetts semiconductor and sensing company
  founded in 2020 by Matthew Carey, Gregory Charvat and Nicholas Saiz that is commercializing
  terahertz-band vision sensors for vehicles, defense and security screening. Its
  Modular Terahertz Engine (MTE) is an all-solid-state chip architecture built from
  proprietary transmit (TX), receive (RX) and Teracore processing silicon, delivering
  0.13-degree native angular resolution at 300+ meters in day, night, rain, fog and
  snow, positioned to sit alongside cameras and to displace radar and lidar in SAE
  L1-L5 driver assistance and autonomy programs. The company emerged from stealth in
  late 2025 with a $150M Series B led by VXI Capital with Ibex Investors, Capricorn
  Investment Group, The Engine Ventures and Lockheed Martin Ventures, and is working
  with global OEMs and Tier-One suppliers toward a 2028 model-year launch. Teradar is
  a hardware and silicon company: it publishes a marketing site and product
  specification sheets, but no public developer program, API, SDK, or machine-readable
  interface contract.'
